<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>科学研究实验记录与协作平台</title>
    <style>
      :root {
        --ink: #20211d;
        --muted: #6f7168;
        --line: #dedccf;
        --paper: #f4f1e8;
        --panel: #fffdf4;
        --green: #376b4c;
        --blue: #315f86;
        --amber: #a36518;
        --red: #aa3d35;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Gill Sans", "Avenir Next", "Segoe UI", sans-serif;
        background: var(--paper);
        color: var(--ink);
      }
      .shell {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        min-height: 100vh;
      }
      aside {
        padding: 30px 24px;
        border-right: 1px solid var(--line);
        background: #ebe7d9;
        position: sticky;
        top: 0;
        height: 100vh;
      }
      h1 { margin: 0 0 30px; font-size: 27px; line-height: 1.08; letter-spacing: 0; }
      h2 { margin: 0 0 18px; font-size: 24px; }
      .nav {
        width: 100%;
        border: 0;
        background: transparent;
        padding: 12px 10px;
        border-radius: 6px;
        display: block;
        text-align: left;
        font-size: 15px;
        cursor: pointer;
      }
      .nav.active, .nav:hover { background: #dad2be; }
      main { padding: clamp(22px, 3vw, 44px); }
      .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; align-items: center; }
      input, select, textarea {
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px 10px;
        background: #fffdf7;
      }
      textarea { width: min(680px, 100%); min-height: 82px; display: block; }
      button.action {
        min-height: 38px;
        border: 0;
        border-radius: 6px;
        padding: 8px 14px;
        color: white;
        background: var(--green);
        cursor: pointer;
      }
      button.secondary { background: var(--blue); }
      button.warning { background: var(--amber); }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 20px; }
      .card, table {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .card { padding: 16px; }
      .stat { font-size: 30px; font-weight: 700; margin-top: 8px; }
      .progress { height: 10px; background: #e3dfd0; border-radius: 999px; overflow: hidden; margin-top: 8px; }
      .progress > span { display: block; height: 100%; background: var(--green); }
      table { width: 100%; border-collapse: collapse; overflow: hidden; }
      th, td { padding: 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
      th { color: var(--muted); font-size: 13px; background: #ece6d7; }
      .badge { display: inline-flex; border-radius: 999px; padding: 4px 9px; font-size: 12px; background: #ebe6d7; }
      .badge.Active, .badge.Approved, .badge.Safe, .badge.Received { color: var(--green); background: #ddebdc; }
      .badge.Submitted, .badge.Proposal, .badge.Irritant, .badge.Flammable, .badge.PendingApproval { color: var(--amber); background: #f5e8d1; }
      .badge.Rejected, .badge.Corrosive, .badge.Toxic, .badge.Explosive { color: var(--red); background: #f2dbd8; }
      .badge.Cancelled, .badge.Archived { color: var(--muted); background: #e6e3d8; }
      .alert { border-left: 5px solid var(--red); background: #faeee8; padding: 12px 14px; border-radius: 6px; margin-bottom: 16px; }
      @media (max-width: 760px) {
        .shell { grid-template-columns: 1fr; }
        aside { height: auto; position: static; border-right: 0; border-bottom: 1px solid var(--line); }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside>
        <h1>科学研究实验<br />记录与协作平台</h1>
        <button class="nav active" data-view="dashboard">项目总览</button>
        <button class="nav" data-view="projects">项目管理</button>
        <button class="nav" data-view="experiments">实验记录</button>
        <button class="nav" data-view="reagents">试剂管理</button>
        <button class="nav" data-view="usages">领用记录</button>
      </aside>
      <main id="app">加载中...</main>
    </div>
    <script>
      const api = async (path, options = {}) => {
        const response = await fetch(`/api${path}`, {
          ...options,
          headers: { "content-type": "application/json", "x-demo-role": "PI", ...(options.headers || {}) }
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.message || "请求失败");
        return payload.data;
      };
      const badge = (value, label) => `<span class="badge ${value}">${label || value}</span>`;
      const USAGE_STATUS_LABELS = { PendingApproval: "待审批", Received: "已领用", Cancelled: "已取消" };
      const REVIEW_STATUS_LABELS = { Draft: "草稿", Submitted: "已提交", Approved: "已通过", Rejected: "已驳回", RevisionRequired: "要求修改" };
      const CLAIMABLE_STATUSES = ["Submitted", "RevisionRequired"];
      const currency = (value) => new Intl.NumberFormat("zh-CN", { style: "currency", currency: "CNY", maximumFractionDigits: 0 }).format(value);
      let state = { view: "dashboard", dashboard: null, projects: [], experiments: [], reagents: [], usages: [], members: [], usageFilters: { reagentId: "", userId: "", status: "" } };

      async function show(view) {
        state.view = view;
        document.querySelectorAll(".nav").forEach((button) => button.classList.toggle("active", button.dataset.view === view));
        if (view === "dashboard") state.dashboard = await api("/dashboard");
        if (view === "projects") { state.projects = await api("/projects"); state.members = await api("/members"); }
        if (view === "experiments") { state.experiments = await api("/experiments"); state.projects = await api("/projects"); }
        if (view === "reagents") state.reagents = await api("/reagents");
        if (view === "usages") {
          const f = state.usageFilters;
          state.usages = await api(`/reagent-usages?reagentId=${f.reagentId}&userId=${f.userId}&status=${f.status}`);
          state.reagents = await api("/reagents");
          state.experiments = await api("/experiments");
          state.members = await api("/members");
        }
        render();
      }
      function render() {
        const app = document.getElementById("app");
        if (state.view === "dashboard") {
          const d = state.dashboard;
          app.innerHTML = `<h2>项目总览</h2><div class="alert">待审核实验记录 ${d.pendingReviews} 条，低库存试剂 ${d.lowStockReagents.length} 项。</div>
          <section class="grid">
            <div class="card">在研项目<div class="stat">${d.activeProjects.length}</div></div>
            <div class="card">近7天实验记录<div class="stat">${d.recentExperimentCount}</div></div>
            <div class="card">低库存试剂<div>${d.lowStockReagents.map((x) => `${x.name}: ${x.stock}${x.unit}`).join("<br>") || "库存稳定"}</div></div>
          </section>
          ${table(["项目", "方向", "状态", "经费"], d.activeProjects.map((x) => [x.name, x.direction, badge(x.status), progress(x.usedBudget, x.totalBudget)]))}`;
        }
        if (state.view === "projects") {
          app.innerHTML = `<h2>项目管理</h2><div class="toolbar"><button class="action" onclick="createProject()">新建项目</button></div>
          ${table(["项目", "编号", "状态", "经费使用", "成员数"], state.projects.map((x) => [x.name, x.projectNo, badge(x.status), progress(x.usedBudget, x.totalBudget), state.members.filter((m) => m.projectId === x.id).length]))}`;
        }
        if (state.view === "experiments") {
          app.innerHTML = `<h2>实验记录</h2><div class="toolbar"><button class="action" onclick="createExperiment()">创建记录</button></div>
          <textarea placeholder="富文本JSON：支持表格、图片、公式等结构化片段"></textarea>
          ${table(["流程", "标题", "项目", "审核状态", "操作"], state.experiments.map((x) => ["撰写 → 提交 → 审核", x.title, projectName(x.projectId), badge(x.reviewStatus, REVIEW_STATUS_LABELS[x.reviewStatus]), `<button class="action secondary" onclick="submitExperiment('${x.id}')">提交</button> <button class="action secondary" onclick="reviewExperiment('${x.id}', 'Approved')">审核通过</button> <button class="action warning" onclick="reviewExperiment('${x.id}', 'Rejected')">驳回</button>`]))}`;
        }
        if (state.view === "reagents") {
          app.innerHTML = `<h2>试剂管理</h2><div class="toolbar"><button class="action" onclick="createReagent()">新增试剂</button></div>
          ${table(["试剂", "CAS", "危险等级", "库存", "存放位置", "操作"], state.reagents.map((x) => [x.name, x.casNo, badge(x.hazardLevel), stock(x), x.location, `<button class="action secondary" onclick="stockIn('${x.id}')">入库</button>`]))}`;
        }
        if (state.view === "usages") {
          const f = state.usageFilters;
          const reagentOptions = [`<option value="">全部试剂</option>`, ...state.reagents.map((x) => `<option value="${x.id}" ${f.reagentId === x.id ? "selected" : ""}>${x.name}</option>`)].join("");
          const users = state.members.map((m) => m.user).filter((u, i, list) => u && list.findIndex((x) => x && x.id === u.id) === i);
          const userOptions = [`<option value="">全部领用人</option>`, ...users.map((u) => `<option value="${u.id}" ${f.userId === u.id ? "selected" : ""}>${u.name}</option>`)].join("");
          const statusOptions = [["", "全部状态"], ...Object.entries(USAGE_STATUS_LABELS)].map(([v, l]) => `<option value="${v}" ${f.status === v ? "selected" : ""}>${l}</option>`).join("");
          app.innerHTML = `<h2>领用记录</h2><div class="toolbar">
            <select onchange="setUsageFilter('reagentId', this.value)">${reagentOptions}</select>
            <select onchange="setUsageFilter('userId', this.value)">${userOptions}</select>
            <select onchange="setUsageFilter('status', this.value)">${statusOptions}</select>
            <button class="action" onclick="createUsage()">创建领用单</button></div>
          ${state.usages.length ? table(["试剂（可用 / 冻结）", "数量", "领用人", "关联实验", "领用状态", "用途", "领用日期"], state.usages.map((x) => {
            const r = state.reagents.find((item) => item.id === x.reagentId);
            const e = state.experiments.find((item) => item.id === x.experimentId);
            const available = r ? r.stock - (r.frozenStock || 0) : 0;
            return [
              r ? `${r.name}<br><small>可用 ${available}${r.unit} · 冻结 ${r.frozenStock || 0}${r.unit}</small>` : x.reagentId,
              `${x.quantity}${r ? r.unit : ""}`,
              userName(x.userId),
              e ? `${e.title}<br>${badge(e.reviewStatus, REVIEW_STATUS_LABELS[e.reviewStatus])}` : x.experimentId,
              badge(x.status, USAGE_STATUS_LABELS[x.status]),
              x.purpose,
              x.usedAt
            ];
          })) : `<div class="card">暂无领用筛选结果</div>`}`;
        }
      }
      function table(headers, rows) {
        return `<table><thead><tr>${headers.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map((row) => `<tr>${row.map((cell) => `<td>${cell}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
      }
      function progress(used, total) {
        const percent = Math.min(100, Math.round((used / total) * 100));
        return `${currency(used)} / ${currency(total)}<div class="progress"><span style="width:${percent}%"></span></div>`;
      }
      function stock(x) {
        const frozen = x.frozenStock || 0;
        return `<strong style="color:${x.stock < x.minStock ? "var(--red)" : "var(--green)"}">${x.stock}${x.unit}</strong> / 阈值 ${x.minStock}${x.unit}<br><small>可用 ${x.stock - frozen}${x.unit} · 冻结 ${frozen}${x.unit}</small>`;
      }
      const projectName = (id) => state.projects.find((x) => x.id === id)?.name || id;
      const userName = (id) => state.members.find((m) => m.userId === id)?.user?.name || id;
      async function createProject() { await api("/projects", { method: "POST", body: JSON.stringify({ name: "单细胞数据复核项目", projectNo: "RL-2026-BIO-099", direction: "Biology", totalBudget: 180000 }) }); state.projects = await api("/projects"); render(); }
      async function createExperiment() { await api("/experiments", { method: "POST", body: JSON.stringify({ projectId: state.projects[0].id, title: "Western Blot 条件摸索", purpose: "优化抗体稀释比例", method: "WB" }) }); state.experiments = await api("/experiments"); render(); }
      async function submitExperiment(id) { await api(`/experiments/${id}/submit`, { method: "PATCH" }); state.experiments = await api("/experiments"); render(); }
      async function reviewExperiment(id, status) {
        const comment = status === "Approved" ? "记录完整，允许归档" : "数据不足，予以驳回";
        await api(`/experiments/${id}/review`, { method: "PATCH", body: JSON.stringify({ status, comment }) });
        state.experiments = await api("/experiments");
        render();
      }
      async function createReagent() { await api("/reagents", { method: "POST", body: JSON.stringify({ name: "Tris-HCl", casNo: "1185-53-1", formula: "C4H12ClNO3", stock: 3, minStock: 2, unit: "瓶" }) }); state.reagents = await api("/reagents"); render(); }
      async function stockIn(id) { await api(`/reagents/${id}/stock-in`, { method: "PATCH", body: JSON.stringify({ quantity: 2 }) }); state.reagents = await api("/reagents"); render(); }
      function setUsageFilter(key, value) { state.usageFilters[key] = value; show("usages"); }
      async function createUsage() {
        const claimable = state.experiments.filter((x) => CLAIMABLE_STATUSES.includes(x.reviewStatus));
        if (!claimable.length) { alert("暂无已提交或要求修改的实验，无法创建领用单"); return; }
        const reagentLines = state.reagents.map((x, i) => `${i + 1}. ${x.name}（可用 ${x.stock - (x.frozenStock || 0)}${x.unit} / 冻结 ${x.frozenStock || 0}${x.unit}）`);
        const reagent = state.reagents[Number(prompt(`选择试剂：\n${reagentLines.join("\n")}`, "1")) - 1];
        if (!reagent) return;
        const experimentLines = claimable.map((x, i) => `${i + 1}. ${x.title}（${REVIEW_STATUS_LABELS[x.reviewStatus]}）`);
        const experiment = claimable[Number(prompt(`选择关联实验（仅已提交或要求修改）：\n${experimentLines.join("\n")}`, "1")) - 1];
        if (!experiment) return;
        const quantity = Number(prompt(`领用数量（${reagent.unit}）`, "1"));
        if (!(quantity > 0)) { alert("领用数量必须大于 0"); return; }
        const purpose = prompt("用途说明", "实验消耗") || "实验消耗";
        try {
          await api("/reagent-usages", { method: "POST", body: JSON.stringify({ reagentId: reagent.id, experimentId: experiment.id, quantity, purpose }) });
        } catch (error) {
          alert(error.message);
        }
        await show("usages");
      }
      document.querySelectorAll(".nav").forEach((button) => button.onclick = () => show(button.dataset.view));
      show("dashboard").catch((error) => document.getElementById("app").textContent = error.message);
    </script>
  </body>
</html>
